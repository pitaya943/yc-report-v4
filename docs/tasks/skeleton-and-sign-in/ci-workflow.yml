# 這個檔案由 owner 加到 .github/workflows/ci.yml（agent 不能建立 workflow）。
# 三個 job：測試、規格檢查、容器映像。
name: CI

# 在進 main 的 pull request 上執行；另外在 task 分支被推送時也執行，這樣一個 task 的
# 成果在開 pull request 之前就能被檢查。
on:
  pull_request:
  push:
    branches: [main, "task/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 測試在這個伺服器上自己建立、丟棄資料庫。
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      # 找不到 Node 或 Playwright 時失敗，而不是略過瀏覽器測試。
      REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the program and its test tools
        run: pip install -e ".[dev]"
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" playwright@1.63.0
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/browser-tools/node_modules" >> "$GITHUB_ENV"
      - name: Run the suite
        run: python -m pytest

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements.txt
      - run: python tools/check_spec.py

  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t yc-report .
      - name: The image does not run as root
        run: test "$(docker run --rm yc-report id -u)" != "0"
      - name: Without DATABASE_URL the image refuses to start and names it
        run: |
          if docker run --rm -e APP_ENV=production yc-report > refused.log 2>&1; then
            echo "the container started without DATABASE_URL"; exit 1
          fi
          cat refused.log
          grep -q "DATABASE_URL" refused.log
      - name: With production settings the image migrates and answers /health
        run: |
          docker run -d --name yc-report --network host \
            -e APP_ENV=production \
            -e PORT=8000 \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres \
            yc-report
          for attempt in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)" = "200" ]; then
              echo "/health answered 200"; exit 0
            fi
            sleep 1
          done
          docker logs yc-report
          exit 1
      - name: The container's log
        if: always()
        run: docker logs yc-report || true
