<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}｜YC 日報系統</title>
  <script src="{{ htmx.url }}" integrity="{{ htmx.integrity }}" defer></script>
</head>
<body{% if session %} hx-headers='{{ {csrf.header: session.csrf_token}|tojson }}'{% endif %}>
  <header>
    <strong>YC 日報系統</strong>
    {% if session %}
    <span id="signed-in-as">{{ session.actor.name }}（{{ role_labels[session.actor.role] }}）</span>
    <form method="post" action="/sign-out">
      <input type="hidden" name="{{ csrf.field }}" value="{{ session.csrf_token }}">
      <button type="submit">登出</button>
    </form>
    {% endif %}
  </header>
  <main>
{% block content %}{% endblock %}
  </main>
</body>
</html>
