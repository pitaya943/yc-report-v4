{% extends "core/base.html" %}
{% block title %}登入{% endblock %}
{% block content %}
<h1>登入</h1>
{% if message %}<p role="alert">{{ message }}</p>{% endif %}
{% if notice %}<p role="status">{{ notice }}</p>{% endif %}
<form method="post" action="/sign-in">
  <label>類型
    <select name="group" required hx-get="/sign-in/names" hx-target="#name" hx-trigger="change">
      <option value="">請選擇類型</option>
      {% for value, group in groups.items() %}<option value="{{ value }}">{{ group.label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>帳戶
    <select id="name" name="name" required>
      <option value="">請選擇帳戶</option>
    </select>
  </label>
  <label>密碼
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button type="submit">登入</button>
</form>
{% endblock %}
